services:
  db:
    image: postgres:latest
    container_name: my_postgres_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: sampledb
    ports:
      - "43544:5432"
    volumes:
      - postgres_data:/home/nabutabu/programs/crane-oss/postgres_data

  localstack:
    image: localstack/localstack:latest
    container_name: crane-localstack
    ports:
      - "4566:4566"  # LocalStack edge service
      - "4510-4559:4510-4559"  # Service port range
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  dominator:
    build:
      context: .
      dockerfile: Dockerfile.dominator
    container_name: crane-dominator
    ports:
      - "44000:44000"
    # depends_on:
    #   db:
    #     condition: service_started
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=mysecretpassword
      - DB_NAME=crane
    volumes:
      - ./policy:/app/policy

  crane-api:
    build:
      context: .
      dockerfile: Dockerfile.crane-api
    container_name: crane-api
    ports:
      - "43060:43060"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=mysecretpassword
      - DB_NAME=crane
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_ENDPOINT_URL=http://localstack:4566
    depends_on:
      - db
      - localstack

  spire-server:
    image: ghcr.io/spiffe/spire-server:nightly
    container_name: crane-spire-server
    ports:
      - "8081:8081"
    volumes:
      - ./spire/server:/opt/spire/conf/server
      - ./spire/data:/opt/spire/data
    depends_on:
      - db


volumes:
  postgres_data:
