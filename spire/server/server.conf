server {
    bind_address = "0.0.0.0"
    bind_port = "8081"
    trust_domain = "crane.internal"
    data_dir = "/opt/spire/data"
    log_level = "DEBUG"
}

plugins {
    DataStore "sql" {
        plugin_data {
            database_type = "postgres"
            connection_string = "host=db port=5432 dbname=spire user=postgres password=mysecretpassword sslmode=disable"
        }
    }

    NodeAttestor "aws_iid" {
        plugin_data {
            account_ids_for_local_validation = ["YOUR_AWS_ACCOUNT_ID"]
        }
    }

    NodeAttestor "join_token" {
        plugin_data {}
    }

    KeyManager "disk" {
        plugin_data {
            keys_path = "/opt/spire/data/keys"
        }
    }
}
