# Non-secret example. Supply a protected deployment copy as the exporter.yaml
# key of Secret crane-system/otel-exporter-config. Do not commit credentials.
exporters:
  otlp_http/backend:
    endpoint: https://your-otlp-backend.example
    headers:
      Authorization: "Bearer REPLACE_WITH_BACKEND_CREDENTIAL"
    # For private CAs or mTLS, add files to the same Secret and reference them:
    # tls:
    #   ca_file: /etc/otel-exporter/ca.crt
    #   cert_file: /etc/otel-exporter/client.crt
    #   key_file: /etc/otel-exporter/client.key
    # New Relic example: endpoint https://otlp.nr-data.net, header api-key.
