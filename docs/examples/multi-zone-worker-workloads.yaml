apiVersion: v1
kind: Namespace
metadata:
  name: crane-worker-acceptance
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mixed-http
  namespace: crane-worker-acceptance
spec:
  replicas: 4
  selector:
    matchLabels: {app: mixed-http}
  template:
    metadata:
      labels: {app: mixed-http}
    spec:
      nodeSelector: {platform.crane.io/node-pool: shared-pool}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: {app: mixed-http}
      tolerations:
        - {key: workload, value: memory, operator: Equal, effect: NoSchedule}
      containers:
        - name: http
          image: busybox:1.36.1
          command: [sh, -c, 'mkdir -p /www; printf "%s\n" "$NODE_NAME" > /www/index.html; httpd -f -p 8080 -h /www']
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef: {fieldPath: spec.nodeName}
          ports: [{containerPort: 8080}]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 32Mi}
          readinessProbe:
            httpGet: {path: /, port: 8080}
---
apiVersion: v1
kind: Service
metadata:
  name: mixed-http
  namespace: crane-worker-acceptance
spec:
  selector: {app: mixed-http}
  ports: [{port: 8080, targetPort: 8080}]
---
apiVersion: batch/v1
kind: Job
metadata:
  name: mixed-client
  namespace: crane-worker-acceptance
spec:
  completions: 2
  parallelism: 2
  template:
    metadata:
      labels: {app: mixed-client}
    spec:
      nodeSelector: {platform.crane.io/node-pool: shared-pool}
      restartPolicy: OnFailure
      tolerations:
        - {key: workload, value: memory, operator: Equal, effect: NoSchedule}
      containers:
        - name: client
          image: busybox:1.36.1
          command: [sh, -c, 'set -eu; for i in 1 2 3 4 5; do wget -qO- http://mixed-http:8080; sleep 1; done']
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 32Mi}
