# This workflow verifies the Go module: tidy, formatting, vet, build, and tests.
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # Reusable: release.yml calls this workflow as its test gate before anything
  # is published (see .github/workflows/release.yml).
  workflow_call:

jobs:

  build:
    runs-on: ubuntu-latest

    services:
      localstack:
        image: localstack/localstack:3
        ports:
          - 4566:4566
        env:
          SERVICES: ec2,elasticloadbalancingv2,rds

    env:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache: true

    - name: Verify go.mod is tidy
      run: |
        go mod tidy
        if ! git diff --quiet go.mod go.sum; then
          echo "::error::go.mod / go.sum are not tidy. Run 'go mod tidy' and commit."
          git --no-pager diff go.mod go.sum
          exit 1
        fi

    - name: Check formatting
      run: |
        unformatted="$(gofmt -l .)"
        if [ -n "$unformatted" ]; then
          echo "::error::The following files are not gofmt-formatted:"
          echo "$unformatted"
          exit 1
        fi

    - name: Vet
      run: go vet ./...

    - name: Build
      run: go build -v ./...

    - name: Wait for LocalStack
      run: |
        for i in $(seq 1 30); do
          if curl -sf http://localhost:4566/_localstack/health >/dev/null; then
            echo "LocalStack is ready"
            exit 0
          fi
          echo "Waiting for LocalStack ($i/30)..."
          sleep 2
        done
        echo "::error::LocalStack did not become ready in time"
        exit 1

    # NOTE: -race is intentionally omitted. The problemcache package has a
    # pre-existing data race (see docs/project-review.md §3.7) that must be
    # fixed before the race detector can be enabled as a required gate.
    - name: Test
      run: go test ./...
