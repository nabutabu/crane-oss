agent {
    data_dir = "/var/lib/crane/spire-agent"
    trust_domain = "${trust_domain}"
    server_address = "${spire_server_address}"
    server_port = "8081"
    socket_path = "/run/spire/sockets/agent.sock"
    trust_bundle_path = "/etc/crane/bundle.pem"
}

plugins {
    WorkloadAttestor "unix" {
        plugin_data {}
    }
    NodeAttestor "aws_iid" {
        plugin_data {}
    }
    KeyManager "disk" {
        plugin_data {
            directory = "/var/lib/crane/spire-agent"
        }
    }
}
